name: Release

# Pushing a version tag (1.2.3 or v1.2.3) releases that commit, when it has a
# release.md with something in it: the notes for the release. The commit is
# tested, `runners` is built for Apple silicon (signed and notarized when the
# repository has the signing secrets) and, statically, for Linux on x86_64
# and aarch64, and a GitHub release with the archives, their checksums and
# those notes is published. Then release.md is removed from the default
# branch, so the next release needs new notes.
#
# A tag without notes releases nothing: the other jobs are skipped. The
# archives' names have no version, so
# releases/latest/download/runners-macos-arm64.tar.gz always works. A tag with
# a suffix (1.2.3-beta.1) makes a pre-release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Only the publish job gets a write token, and only the sign job gets the
# signing secrets; neither runs any of the repository's code.
permissions:
  contents: read

# A release finishes once started; a second push of the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Find the release notes
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.notes.outputs.found }}
      sign: ${{ steps.secrets.outputs.sign }}
    steps:
      - name: Checkout release.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release.md
          sparse-checkout-cone-mode: false

      # Blank lines alone are no notes.
      - name: Check release.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f release.md ] && grep -q '[^[:space:]]' release.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Nothing released::$TAG has no release.md with notes in it, so it is not released."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Whether each secret is set, never its value.
      - name: Check the signing secrets
        id: secrets
        if: steps.notes.outputs.found == 'true'
        env:
          HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
          HAS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY != '' }}
          HAS_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID != '' }}
          HAS_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID != '' }}
        run: |
          MISSING=()
          for NAME in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            HAS="HAS_$NAME"
            if [ "${!HAS}" != "true" ]; then MISSING+=("$NAME"); fi
          done
          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          elif [ "${#MISSING[@]}" -eq 5 ]; then
            echo "::warning title=Not signed::The repository has no signing secrets, so runners ships unsigned and not notarized."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Signing secrets missing::Set ${MISSING[*]} too, or none of the signing secrets."
            exit 1
          fi

  # When a change touches .github, zizmor audits the workflows and actions
  # first; the build and publish jobs wait for it.
  zizmor:
    name: zizmor
    needs: notes
    if: needs.notes.outputs.found == 'true'
    uses: $/.github/workflows/zizmor.yml

  build:
    name: Test and build
    needs: zizmor
    # Package.swift needs macOS 27, which only the xcode-27 image (a public
    # preview) runs.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Swift
        uses: $/.github/actions/setup-swift
        with:
          swift-version: "6.4"

      - name: Test
        run: swift test

      # After the tests, which expect "dev".
      - name: Stamp the version
        run: .github/scripts/stamp-version.sh "$TAG"

      - name: Build
        run: swift build -c release --arch arm64 --product runners

      # Stripped, it must still start and say which release it is.
      - name: Strip
        run: |
          mkdir -p dist
          cp "$(swift build -c release --arch arm64 --show-bin-path)/runners" dist/runners
          strip dist/runners
          dist/runners --help > /dev/null
          test "$(dist/runners --version)" = "${TAG#v}"

      - name: Keep the binary for signing and publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary
          path: dist/runners
          if-no-files-found: error
          retention-days: 1

  # Signs the binary with the Developer ID certificate and has Apple notarize
  # it. It runs only when the repository has the signing secrets, so a release
  # without them never waits for a second macOS runner. It checks out
  # nothing, so no code of the repository runs where the secrets are.
  sign:
    name: Sign and notarize
    needs: [notes, build]
    if: needs.notes.outputs.sign == 'true'
    runs-on: macos-26
    steps:
      - name: Fetch the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: bin

      # Artifacts don't keep the executable bit.
      - name: Make it executable
        run: chmod +x bin/runners

      # A keychain of its own, which the last step deletes.
      - name: Sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          read -r -d '' -a SEARCH < <(security list-keychains -d user | tr -d '"') || true
          security list-keychains -d user -s "$KEYCHAIN" "${SEARCH[@]}"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application: / { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE has no Developer ID Application certificate with its private key."
            exit 1
          fi
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --options runtime --timestamp bin/runners
          codesign --verify --strict --verbose=2 bin/runners
          codesign --display --verbose=2 bin/runners 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime Version)='

      # notarytool takes a zip, not a bare binary; and a bare binary can't be
      # stapled, so Gatekeeper looks the ticket up online.
      - name: Notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$NOTARY_KEY" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          ditto -c -k --norsrc --noextattr bin/runners "$RUNNER_TEMP/runners.zip"
          xcrun notarytool submit "$RUNNER_TEMP/runners.zip" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          ID=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json" 2> /dev/null || true)
          STATUS=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json" 2> /dev/null || true)
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" "${AUTH[@]}" || true; fi
            echo "::error title=Not notarized::Notarization ended with \"${STATUS:-no status}\"."
            exit 1
          fi
          spctl --assess --type install --verbose=2 bin/runners \
            || echo "::warning::Notarized, but spctl does not accept runners yet."

      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"

      - name: Keep the signed binary for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: bin/runners
          if-no-files-found: error
          retention-days: 1

  # Static binaries, built with swift.org's Static Linux SDK (musl), need
  # nothing on the host but CA certificates. One x86_64 job cross-builds
  # both. The SDK must be for the image's exact Swift version, so the image
  # is pinned to it.
  linux:
    name: Test and build for Linux
    needs: zizmor
    runs-on: ubuntu-latest
    container:
      image: swift:6.4.2
    # A container job's steps run in sh, which has no arrays.
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      SDK_URL: https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
      SDK_SHA256: 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: swift test

      - name: Stamp the version
        run: .github/scripts/stamp-version.sh "$TAG"

      # `swift sdk install <url>` aborts once it has downloaded (the same
      # FoundationNetworking crash runners works around), so curl fetches it,
      # and the install is from the file whose SHA-256 checked out.
      - name: Install the Static Linux SDK
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/static-sdk.tar.gz" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/static-sdk.tar.gz" | sha256sum -c -
          swift sdk install "$RUNNER_TEMP/static-sdk.tar.gz"
          swift sdk list

      # Stripped at link time, which works for either arch.
      - name: Build
        run: |
          for ARCH in x86_64 aarch64; do
            OPTIONS=(-c release --swift-sdk "$ARCH-swift-linux-musl" --product runners -Xlinker -s)
            swift build "${OPTIONS[@]}"
            mkdir -p "bin/$ARCH"
            cp "$(swift build "${OPTIONS[@]}" --show-bin-path)/runners" "bin/$ARCH/runners"
          done

      # Each binary is static and for its arch; the x86_64 one, which this
      # runner can start, must say which release it is.
      - name: Check
        run: |
          for ARCH in x86_64 aarch64; do
            if readelf -l "bin/$ARCH/runners" | grep "program interpreter"; then
              echo "::error::The $ARCH binary is not static."
              exit 1
            fi
          done
          readelf -h bin/x86_64/runners | grep "Machine:.*X86-64"
          readelf -h bin/aarch64/runners | grep "Machine:.*AArch64"
          bin/x86_64/runners --help > /dev/null
          test "$(bin/x86_64/runners --version)" = "${TAG#v}"

      - name: Package
        run: |
          mkdir -p dist
          for ARCH in x86_64 aarch64; do
            ARCHIVE="runners-linux-$ARCH.tar.gz"
            tar -czf "dist/$ARCHIVE" -C "bin/$ARCH" runners
            (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
            cat "dist/$ARCHIVE.sha256"
          done

      - name: Keep the archives for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/runners-linux-*
          if-no-files-found: error
          retention-days: 1

  # Packs the macOS binary, signed when the sign job ran, then publishes it
  # with the Linux archives.
  publish:
    name: Publish the release
    needs: [build, sign, linux]
    # A skipped sign job, for want of secrets, doesn't hold the release back.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.linux.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      # The tagged commit's release.md, read and never run.
      - name: Checkout release.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release.md
          sparse-checkout-cone-mode: false

      - name: Fetch the macOS binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'signed' || 'binary' }}
          path: bin

      # Artifacts don't keep the executable bit. The signature is inside the
      # binary, so the tar.gz keeps it.
      - name: Pack the macOS binary
        env:
          ARCHIVE: runners-macos-arm64.tar.gz
        run: |
          chmod +x bin/runners
          mkdir -p dist
          tar --owner=0 --group=0 --numeric-owner -czf "dist/$ARCHIVE" -C bin runners
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
          cat "dist/$ARCHIVE.sha256"

      - name: Fetch the Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist

      # Skipped when a re-run finds the release already published, so a run
      # that failed after it can finish the cleanup.
      - name: Create the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$TAG is already released."
            exit 0
          fi
          PRERELEASE=()
          if [[ "$TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release.md \
            --verify-tag \
            "${PRERELEASE[@]}"

      # One commit on the default branch, made through the API: it deletes
      # release.md only while it is the file this tag released, so notes
      # already written for the next release stay.
      - name: Remove release.md from the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          RELEASED=$(git rev-parse HEAD:release.md)
          if ! CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/contents/release.md?ref=$BRANCH" --jq .sha 2> "$RUNNER_TEMP/error"); then
            if grep -q "HTTP 404" "$RUNNER_TEMP/error"; then
              echo "::notice::$BRANCH has no release.md to remove."
              exit 0
            fi
            cat "$RUNNER_TEMP/error" >&2
            exit 1
          fi
          if [ "$CURRENT" != "$RELEASED" ]; then
            echo "::warning title=release.md kept::release.md on $BRANCH is not the one $TAG released, so it stays."
            exit 0
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/release.md" \
            -f message="Remove release.md after releasing $TAG" \
            -f sha="$CURRENT" \
            -f branch="$BRANCH" \
            --jq '"Removed in " + .commit.sha'
